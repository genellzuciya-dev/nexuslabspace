<svg width="680" height="380" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The joining sequence of Canada geese</title>
<desc>A field-journal figure. Five Canada geese paddle across open water toward an established group foraging on grass. The lead goose pauses at the water-land threshold and preens, and the two geese behind it sham-feed, tipping their bills into the water without really eating. Among the resident group, most keep grazing with bills down in the grass while two raise their heads to assess the newcomers, shown by dashed sightlines.</desc>
